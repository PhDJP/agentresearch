# Qué datos de terceros versiona este estudio (agentresearch, ADR-0010).
#
# Todo se importa y se conserva COMPLETO en local (carpeta exportaciones_originales/, que
# Git ignora). Lo que se versiona en importaciones/ lo decide este archivo: solo los
# campos listados aquí cuya base esté COMPLETA. El resumen y las palabras clave nunca se
# versionan. Un campo ausente o con la base incompleta se importa en local y no se publica.
#
# La BASE dice quién confirmó que ese campo puede publicarse:
#   tipo: institucion | revista | licencia   (un término de contrato es una licencia)
#   detalle: quién o qué lo confirmó (p. ej. la dependencia, la política citada o la cláusula)
#   medio: cómo se obtuvo la confirmación; se pide solo con tipo "institucion"
#   fecha: día de la confirmación, AAAA-MM-DD
# Complete la base de cada campo cuando reciba la confirmación. Hasta entonces, el campo
# queda solo en local. Este archivo es suyo: `estudio actualizar` lo crea si no existe y
# nunca lo sobrescribe.

fuentes:
  scopus:
    campos:
      titulo:
        base: {tipo: institucion, detalle: null, medio: null, fecha: null}
      autores:
        base: {tipo: institucion, detalle: null, medio: null, fecha: null}
      doi:
        base: {tipo: institucion, detalle: null, medio: null, fecha: null}
      fuente_publicacion:
        base: {tipo: institucion, detalle: null, medio: null, fecha: null}
