# Cita breve de evidencia literal tomada de un campo no publicable (ADR-0010, punto 5).
# "permitido" exige una base completa.
evidencia_literal:
  resumen: {estado: no_permitido, base: null}

# Respaldo de los originales en la nube institucional, por fuente (ADR-0010, punto 9).
# Lo ausente equivale a "sin_verificar": el respaldo se recomienda fuera de la nube.
# Ejemplo, con su base completa:
#
# respaldo_nube:
#   scopus:
#     estado: permitido
#     base: {tipo: licencia, detalle: "…", fecha: "AAAA-MM-DD"}
