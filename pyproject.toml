[project]
name = "agentresearch"
version = "0.0.1"
description = "Agente investigador para estudios de mapeo sistematico de la literatura, con Kitchenham, Petersen y PRISMA-ScR."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Juan Pablo Gomez Ballesteros", email = "juangomezb@unicauca.edu.co" }
]
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
agentresearch = "agentresearch.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=agentresearch --cov-report=term-missing"
