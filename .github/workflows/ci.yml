name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  pruebas:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7

      - name: Instalar uv y Python
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
          python-version: "3.12"
          enable-cache: true

      - name: Instalar dependencias
        run: uv sync --locked

      - name: ruff
        run: uv run ruff check .

      - name: mypy
        run: uv run mypy

      - name: pytest
        run: uv run pytest

      - name: Cobertura mínima de trazabilidad y protocolo
        run: uv run coverage report --include="src/agentresearch/trazabilidad/*,src/agentresearch/protocolo/*,src/agentresearch/estudio/*" --fail-under=90
